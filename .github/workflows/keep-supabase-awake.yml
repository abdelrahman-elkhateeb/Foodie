# Free Supabase projects pause after 7 days without activity.
# A tiny read every 3 days keeps the demo up.
# Needs repo secrets: SUPABASE_URL and SUPABASE_ANON_KEY (same values as .env).
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
