<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Foodie: a bilingual food ordering app with live order tracking and an admin dashboard, built with React and Supabase."
    />
    <title>Foodie · Order food online</title>

    <!-- Link previews (WhatsApp, Facebook, X). Crawlers don't run JS, so these stay static. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Foodie" />
    <meta property="og:title" content="Foodie · Order food online" />
    <meta
      property="og:description"
      content="Order food online and track it live. اطلب أكلك أونلاين وتابعه لحظة بلحظة."
    />
    <meta property="og:url" content="https://food-ordering-app-pearl-alpha.vercel.app" />
    <meta property="og:image" content="https://food-ordering-app-pearl-alpha.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Foodie: order food online, track it live" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FACC15" />
    <script>
      // Apply the saved language direction before first paint (no RTL flash).
      try {
        var lang = localStorage.getItem("language") || "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
